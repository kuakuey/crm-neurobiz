openapi: 3.0.3
info:
  title: CRM Neurobiz API
  version: 1.0.0
  description: API para n8n. Autenticación Bearer (Sanctum).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /people:
    post:
      summary: Upsert de persona por teléfono o email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string }
                source: { type: string }
                chatwoot_contact_id: { type: string }
      responses:
        '201': { description: Creada o actualizada }
  /people/{id}:
    get:
      summary: Contexto de persona
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Ficha }
  /deals:
    post:
      summary: Crear deal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                person_id: { type: integer }
                pipeline: { type: string, example: neurobusiness-b2b }
                stage: { type: string, example: lead }
                offering: { type: string }
                title: { type: string }
                source: { type: string }
      responses:
        '201': { description: Creado }
  /deals/{id}/stage:
    patch:
      summary: Cambiar etapa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { description: ID numérico o slug }
      responses:
        '200': { description: Actualizado }
  /activities:
    post:
      summary: Crear actividad o nota
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                person_id: { type: integer }
                deal_id: { type: integer }
                type: { type: string, enum: [call, whatsapp, meeting, task, note] }
                title: { type: string }
                body: { type: string }
                due_at: { type: string, format: date-time }
      responses:
        '201': { description: Creada }
  /notes:
    post:
      summary: Alias de activities (type=note)
      responses:
        '201': { description: Creada }
  /contacts/find-duplicates:
    post:
      summary: Equivale a find_duplicate_contacts(phone, email, first_name, company_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                email: { type: string }
                first_name: { type: string }
                company_id: { type: integer }
      responses:
        '200': { description: Coincidencias }
        '401': { description: Sin token }
  /channels:
    get:
      summary: Catálogo de canales
      parameters:
        - in: query
          name: name
          schema: { type: string, example: WhatsApp }
      responses:
        '200': { description: Canales }
        '401': { description: Sin token }
  /lead-sources:
    get:
      summary: Catálogo de fuentes
      responses:
        '200': { description: Fuentes }
        '401': { description: Sin token }
  /whatsapp/messages:
    post:
      summary: Ingesta idempotente de un mensaje entrante de WhatsApp
      description: Deduplica por teléfono normalizado, crea el contacto sin gestor si no existe y registra la actividad. El mismo external_ref no duplica la actividad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, example: "+593 99 123 4567" }
                email: { type: string }
                first_name: { type: string }
                company_id: { type: integer }
                result: { type: string }
                message: { type: string }
                external_ref: { type: string, example: "chatwoot:msg:123" }
      responses:
        '201': { description: Actividad creada }
        '200': { description: Reintento idempotente }
        '401': { description: Sin token }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
